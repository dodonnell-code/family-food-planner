name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Sync across devices (README › Sync). Set with: gh variable set DEXIE_CLOUD_URL --body <url>
          VITE_DEXIE_CLOUD_URL: ${{ vars.DEXIE_CLOUD_URL }}
          # Fingerprints of the emails allowed to sync: gh variable set SYNC_EMAIL_HASHES --body <hash>
          VITE_SYNC_EMAIL_HASHES: ${{ vars.SYNC_EMAIL_HASHES }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
